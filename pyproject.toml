[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-iam-misconfiguration-detector"
version = "0.1.0.dev0"
description = "An offline AWS IAM policy analyzer under development"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Samantha Muthoni"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["iam_detector*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
